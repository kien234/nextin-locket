# Cấu hình mẫu Nextin / Clash Meta với DNS Static Hosts
port: 7890
socks-port: 7891
allow-lan: true
mode: rule
log-level: info

# --- ĐOẠN CẤU HÌNH HOSTS SỬA DNS ---
hosts:
  'api.revenuecat.com': 160.191.243.72
  'firebaseremoteconfig.googleapis.com': 160.191.243.72

dns:
  enable: true
  enhanced-mode: fake-ip
  nameserver:
    - 114.114.114.114
    - 8.8.8.8

proxies:
  - name: "Proxy Mẫu (Thay thế bằng node của bạn)"
    type: ss
    server: server.example.com
    port: 443
    cipher: aes-256-gcm
    password: "password"

proxy-groups:
  - name: PROXY
    type: select
    proxies:
      - "Proxy Mẫu (Thay thế bằng node của bạn)"
      - DIRECT

rules:
  - MATCH,PROXY